document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

v>\n\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"padding:40px 0 0 7vw;overflow:hidden\" aria-labelledby=\"hero-h\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:stretch;gap:56px 64px\">\n          <div style=\"flex:5 1 400px;min-width:0;max-width:600px;display:flex;flex-direction:column;gap:28px;padding:24px 7vw 72px 0;box-sizing:content-box\">\n            <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#6B6B7B\">Rota &amp; timesheet software<\u002Fp>\n            <h1 id=\"hero-h\" style=\"margin:0;font-size:clamp(44px,5.6vw,88px);font-weight:600;line-height:0.96;letter-spacing:-0.03em;text-wrap:balance\">Rotas and hours, finally in one place.<\u002Fh1>\n            <p style=\"margin:0;font-size:18px;line-height:1.6;color:#4A4A5A;max-width:48ch;text-wrap:pretty\">Plan shifts, record actual times, approve timesheets and export payroll-ready hours. For teams with one site or many, with every feature in every plan.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n              <a href=\"{{ trialUrl }}\" style=\"display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;padding:16px 26px;background:#7C3AED;color:#FFFFFF\" style-hover=\"background:#6D28D9;color:#FFFFFF\">Start your 14-day free trial\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fa>\n              <a href=\"#/pricing\" style=\"display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;padding:15px 25px;border:1px solid #0A0A0F;color:#0A0A0F\" style-hover=\"background:#0A0A0F;color:#FFFFFF\">See pricing<\u002Fa>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:13px;line-height:1.6;color:#6B6B7B;border-top:2px solid #0A0A0F;padding-top:16px;white-space:normal\">Card optional for the trial · Pay by card, Apple Pay, Google Pay or Direct Debit · Cancel any time<\u002Fp>\n          <\u002Fdiv>\n          <div aria-label=\"Product preview\" style=\"flex:7 1 520px;min-width:0;position:relative;min-height:clamp(380px,48vw,680px);background:linear-gradient(135deg,#A78BFA 0%,#7C3AED 39%,#3B82F6 100%)\">\n            <div style=\"position:absolute;left:clamp(20px,3.5vw,56px);top:clamp(20px,3.5vw,56px);right:0;bottom:0;overflow:hidden;background:#FFFFFF;box-shadow:0 30px 80px rgba(46,16,101,0.4)\">\n              <img src=\"4340495c-f398-42d6-b5ac-2c627bfd7ca7\" width=\"1431\" height=\"706\" alt=\"The NEXTime weekly rota: staff in rows, days in columns, each shift showing its times and paid hours.\" style=\"display:block;width:1100px;max-width:none;height:auto\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"features\" style=\"background:#F7F7F9;padding:88px 7vw;border-top:1px solid #E7E7EC;border-bottom:1px solid #E7E7EC\" aria-labelledby=\"feat-h\">\n        <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:48px\">\n          <span style=\"font-size:13px;font-weight:600;letter-spacing:0.2em;color:#7C3AED\">01<\u002Fspan>\n          <h2 id=\"feat-h\" style=\"margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:600;letter-spacing:-0.025em\">What it does<\u002Fh2>\n          <span style=\"flex:1;height:2px;background:#E7E7EC\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));border-top:2px solid #0A0A0F\">\n          <sc-for list=\"{{ features }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <div style=\"padding:28px 28px 32px 0;border-right:1px solid #E7E7EC;border-bottom:1px solid #E7E7EC;display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font-size:12px;font-weight:600;letter-spacing:0.16em;color:#7C3AED;font-variant-numeric:tabular-nums\">{{ f.num }}<\u002Fspan>\n              <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.02em\">{{ f.title }}<\u002Fh3>\n              <p style=\"margin:0;font-size:14px;line-height:1.65;color:#4A4A5A;text-wrap:pretty;padding-right:8px\">{{ f.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"how-it-works\" style=\"padding:88px 7vw\" aria-labelledby=\"how-h\">\n        <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:48px\">\n          <span style=\"font-size:13px;font-weight:600;letter-spacing:0.2em;color:#7C3AED\">02<\u002Fspan>\n          <h2 id=\"how-h\" style=\"margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:600;letter-spacing:-0.025em\">Up and running in an afternoon<\u002Fh2>\n          <span style=\"flex:1;height:2px;background:#E7E7EC\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));border-top:2px solid #0A0A0F\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"padding:24px 24px 24px 0;border-right:1px solid #E7E7EC\">\n              <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:0.16em;color:#7C3AED\">{{ s.num }}<\u002Fp>\n              <p style=\"margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-0.01em\">{{ s.label }}<\u002Fp>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:#4A4A5A;text-wrap:pretty\">{{ s.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"security\" style=\"background:#F7F7F9;padding:88px 7vw;border-top:1px solid #E7E7EC;border-bottom:1px solid #E7E7EC\" aria-labelledby=\"sec-h\">\n        <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:48px\">\n          <span style=\"font-size:13px;font-weight:600;letter-spacing:0.2em;color:#7C3AED\">03<\u002Fspan>\n          <h2 id=\"sec-h\" style=\"margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:600;letter-spacing:-0.025em\">Security and control<\u002Fh2>\n          <span style=\"flex:1;height:2px;background:#E7E7EC\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:48px\">\n          <div>\n            <p style=\"margin:0 0 16px;font-size:clamp(24px,2.8vw,36px);font-weight:600;line-height:1.1;letter-spacing:-0.025em\">Your workspace.<br>Your people.<br>Your rules.<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.7;color:#4A4A5A;max-width:56ch;text-wrap:pretty\">Each company gets its own isolated workspace. Owners decide who sees what, every change is recorded, and your data can leave with you at any time.<\u002Fp>\n          <\u002Fdiv>\n          <ul style=\"list-style:none;margin:0;padding:0;border-top:2px solid #0A0A0F\">\n            <sc-for list=\"{{ security }}\" as=\"x\" hint-placeholder-count=\"5\">\n              <li style=\"display:grid;grid-template-columns:22px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #E7E7EC\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7C3AED\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top:5px\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n                <span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:16px;font-weight:600\">{{ x.title }}<\u002Fspan><span style=\"font-size:14px;line-height:1.6;color:#4A4A5A\">{{ x.text }}<\u002Fspan><\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPricing }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:56px 7vw 48px\" aria-labelledby=\"pr-h\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:end\">\n          <h1 id=\"pr-h\" style=\"margin:0;font-size:clamp(44px,6.8vw,100px);font-weight:600;line-height:0.96;letter-spacing:-0.03em\">One price<br>per team size.<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;line-height:1.6;color:#4A4A5A;max-width:48ch;text-wrap:pretty\">Every feature in every plan. You pay for the number of active staff you schedule, by card, wallet, Direct Debit or annual invoice. Start with 14 days free.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showPlans }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"pricing\" style=\"padding:{{ pricePad }};border-top:{{ priceBorder }}\" aria-labelledby=\"plans-h\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;margin-bottom:32px\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:0.2em;color:#7C3AED\">{{ priceNum }}<\u002Fspan>\n        <h2 id=\"plans-h\" style=\"margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:600;letter-spacing:-0.025em\">Plans<\u002Fh2>\n        <span style=\"flex:1 1 40px;height:2px;background:#E7E7EC\"><\u002Fspan>\n        <div role=\"group\" aria-label=\"Billing cycle\" style=\"display:flex;border:1px solid #0A0A0F\">\n          <sc-for list=\"{{ cycles }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" aria-pressed=\"{{ c.pressed }}\" style=\"font-family:inherit;font-size:14px;font-weight:500;padding:10px 16px;border:0;background:{{ c.bg }};color:{{ c.fg }};cursor:pointer;white-space:nowrap\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));border-top:2px solid #0A0A0F\">\n        <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"padding:28px 28px 32px;border-right:1px solid #E7E7EC;border-bottom:1px solid #E7E7EC;border-left:{{ p.left }};background:{{ p.bg }};display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:{{ p.eyeFg }}\">{{ p.name }}<\u002Fp>\n              <sc-if value=\"{{ p.popular }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#6D28D9;white-space:nowrap\">Most chosen<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:6px\">\n              <span style=\"font-size:clamp(40px,4vw,56px);font-weight:600;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums\">{{ p.price }}<\u002Fspan>\n              <span style=\"font-size:14px;color:#6B6B7B\">{{ p.per }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:13px;color:#6B6B7B;min-height:20px\">{{ p.billed }}<\u002Fspan>\n            <p style=\"margin:0;font-size:17px;font-weight:600;letter-spacing:-0.01em\">{{ p.limit }}<\u002Fp>\n            <p style=\"margin:0;font-size:14px;line-height:1.6;color:#4A4A5A;flex:1;text-wrap:pretty\">{{ p.blurb }}<\u002Fp>\n            <a href=\"{{ p.href }}\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:12px 20px;background:{{ p.ctaBg }};color:{{ p.ctaFg }};border:1px solid {{ p.ctaBorder }}\" style-hover=\"background:{{ p.ctaHover }};color:{{ p.ctaHoverFg }}\">{{ p.cta }}\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 7h10v10\"><\u002Fpath><path d=\"M7 17 17 7\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      \n      <div id=\"ways-to-pay\" style=\"margin-top:56px\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:16px\">\n          <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#6B6B7B\">Ways to pay<\u002Fp>\n          <p style=\"margin:0;font-size:13px;color:#6B6B7B\">Cards and wallets by Stripe · Direct Debit by GoCardless<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));border-top:2px solid #0A0A0F\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:20px 20px 22px 0;border-right:1px solid #E7E7EC;border-bottom:1px solid #E7E7EC\">\n            <div style=\"display:flex;align-items:center;gap:8px;height:28px\"><img src=\"5bd11bdf-b77a-4719-aea7-6ee23be07d90\" alt=\"Visa\" style=\"height:14px;width:auto;display:block\"><img src=\"40e735a2-2f24-49fb-a205-028653362bc2\" alt=\"Mastercard\" style=\"height:24px;width:auto;display:block\"><img src=\"32c0c42f-fbe8-4905-9473-af711b3a87c0\" alt=\"American Express\" style=\"height:24px;width:auto;display:block\"><\u002Fdiv>\n            <span style=\"font-size:15px;font-weight:600\">Debit and credit card<\u002Fspan>\n            <span style=\"font-size:13px;line-height:1.5;color:#4A4A5A\">Visa, Mastercard and American Express. Charged automatically each month or year.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:20px 20px 22px 0;border-right:1px solid #E7E7EC;border-bottom:1px solid #E7E7EC\">\n            <div style=\"display:flex;align-items:center;gap:8px;height:28px\"><img src=\"89f7d875-078b-4655-8987-75686c154e72\" alt=\"Apple Pay\" style=\"height:26px;width:auto;display:block\"><img src=\"0ff56c76-075d-49cf-95bd-1c18c6fb1c56\" alt=\"Google Pay\" style=\"height:26px;width:auto;display:block\"><\u002Fdiv>\n            <span style=\"font-size:15px;font-weight:600\">Apple Pay and Google Pay<\u002Fspan>\n            <span style=\"font-size:13px;line-height:1.5;color:#4A4A5A\">One tap on your phone or browser. No card number to type.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:20px 20px 22px 0;border-right:1px solid #E7E7EC;border-bottom:1px solid #E7E7EC\">\n            <div style=\"display:flex;align-items:center;gap:8px;height:28px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A0A0F\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"><\u002Fline><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"><\u002Fline><polygon points=\"12 2 20 7 4 7\"><\u002Fpolygon><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:15px;font-weight:600\">Direct Debit<\u002Fspan>\n            <span style=\"font-size:13px;line-height:1.5;color:#4A4A5A\">From your bank account: UK Bacs, SEPA, ACH, BECS and PAD. 3 working days’ notice before each payment.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:20px 20px 22px 0;border-right:1px solid #E7E7EC;border-bottom:1px solid #E7E7EC\">\n            <div style=\"display:flex;align-items:center;gap:8px;height:28px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A0A0F\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"M10 9H8\"><\u002Fpath><path d=\"M16 13H8\"><\u002Fpath><path d=\"M16 17H8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:15px;font-weight:600\">Invoice and bank transfer<\u002Fspan>\n            <span style=\"font-size:13px;line-height:1.5;color:#4A4A5A\">For yearly plans and Enterprise. Pay within 30 days, with your PO number on every invoice.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:24px 0 0;font-size:14px;color:#6B6B7B;border-left:3px solid #7C3AED;padding-left:20px;max-width:80ch\">Prices in GBP, excluding VAT. Active staff are people on your staff list not marked as Left. Owner, admin and manager logins are free.<\u002Fp>\n\n      <div id=\"included\" style=\"margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:48px\">\n        <div>\n          <p style=\"margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#6B6B7B\">Included in every plan<\u002Fp>\n          <p style=\"margin:0;font-size:clamp(24px,2.8vw,36px);font-weight:600;line-height:1.1;letter-spacing:-0.025em\">No feature tiers.<br>No add-ons.<\u002Fp>\n        <\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));column-gap:32px;border-top:2px solid #0A0A0F\">\n          <sc-for list=\"{{ included }}\" as=\"i\" hint-placeholder-count=\"10\">\n            <li style=\"display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #E7E7EC;font-size:15px\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7C3AED\" stroke-width=\"2\" s int-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:56px 7vw 48px\" aria-labelledby=\"faqp-h\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:end\">\n          <h1 id=\"faqp-h\" style=\"margin:0;font-size:clamp(44px,6.8vw,100px);font-weight:600;line-height:0.96;letter-spacing:-0.03em\">Questions,<br>answered.<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;line-height:1.6;color:#4A4A5A;max-width:48ch;text-wrap:pretty\">The trial, plans, payment and your data. Can’t find what you need? Email <a href=\"mailto:hello@nexyraconsulting.co.uk?subject=NEXTime\">hello@nexyraconsulting.co.uk<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"padding:0 7vw 88px\" aria-label=\"Questions by topic\">\n        <sc-for list=\"{{ faqGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div id=\"{{ g.id }}\" style=\"display:flex;flex-wrap:wrap;gap:16px 48px;padding:32px 0 8px;border-top:2px solid #0A0A0F\">\n            <div style=\"flex:1 1 240px;display:flex;align-items:baseline;gap:16px\">\n              <span style=\"font-size:13px;font-weight:600;letter-spacing:0.2em;color:#7C3AED\">{{ g.num }}<\u002Fspan>\n              <h2 style=\"margin:0;font-size:clamp(24px,2.6vw,32px);font-weight:600;letter-spacing:-0.02em;line-height:1.1\">{{ g.heading }}<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"flex:2 1 480px;min-width:0\">\n              <sc-for list=\"{{ g.items }}\" as=\"q\" hint-placeholder-count=\"3\">\n                <details id=\"{{ q.id }}\" style=\"border-bottom:1px solid #E7E7EC\">\n                  <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:24px;padding:20px 0;cursor:pointer;font-size:18px;font-weight:600;letter-spacing:-0.01em;white-space:normal\" style-hover=\"color:#7C3AED\">{{ q.q }}\n                    <svg class=\"nx-plus\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex:none;transition:transform .2s ease\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsummary>\n                  <p style=\"margin:0 0 22px;font-size:15px;line-height:1.7;color:#4A4A5A;max-width:72ch;text-wrap:pretty\">{{ q.a }}<\u002Fp>\n                <\u002Fdetails>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n\n    <section data-nav-tone=\"dark\" style=\"background:linear-gradient(135deg,#A78BFA 0%,#7C3AED 39%,#3B82F6 100%);color:#FFFFFF;padding:96px 7vw\" aria-labelledby=\"cta-h\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px;align-items:end\">\n        <h2 id=\"cta-h\" style=\"margin:0;font-size:clamp(36px,5vw,72px);font-weight:600;line-height:1;letter-spacing:-0.03em\">Try it with your own rota.<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:20px;align-items:flex-start\">\n          <p style=\"margin:0;font-size:18px;line-height:1.6;max-width:44ch\">14 days with every feature. Bring your existing NEXTime data across in one click.<\u002Fp>\n          <a href=\"{{ trialUrl }}\" style=\"display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;padding:16px 26px;background:#FFFFFF;color:#2E1065\" style-hover=\"background:#0A0A0F;color:#FFFFFF\">Start free trial\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <footer data-nav-tone=\"dark\" style=\"background:#0A0A0F;color:#FFFFFF;padding:56px 7vw 28px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:32px;padding-bottom:40px;border-bottom:1px solid #2A2A36\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <img src=\"c722216f-1835-47dc-8900-c725d73359b5\" alt=\"NEXTime Rota &amp; Timesheet\" style=\"width:176px;height:auto;display:block;margin-left:-7px\">\n        <span style=\"font-size:13px;line-height:1.6;color:#B4B4C4\">A product of Nexyra Consulting.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#A78BFA\">Product<\u002Fspan>\n        <a href=\"#/\" style=\"color:#FFFFFF;font-size:14px\" style-hover=\"color:#A78BFA\">Overview<\u002Fa>\n        <a href=\"#/pricing\" style=\"color:#FFFFFF;font-size:14px\" style-hover=\"color:#A78BFA\">Pricing<\u002Fa>\n        <a href=\"#/faq\" style=\"color:#FFFFFF;font-size:14px\" style-hover=\"color:#A78BFA\">FAQ<\u002Fa>\n        <a href=\"{{ signInUrl }}\" style=\"color:#FFFFFF;font-size:14px\" style-hover=\"color:#A78BFA\">Sign in<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#A78BFA\">Company<\u002Fspan>\n        <a href=\"https://nexyraconsulting.co.uk/\" style=\"color:#FFFFFF;font-size:14px\" style-hover=\"color:#A78BFA\">Nexyra Consulting<\u002Fa>\n        <a href=\"mailto:hello@nexyraconsulting.co.uk\" style=\"color:#FFFFFF;font-size:14px\" style-hover=\"color:#A78BFA\">hello@nexyraconsulting.co.uk<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#A78BFA\">Legal<\u002Fspan>\n        <span style=\"color:#B4B4C4;font-size:14px\">Terms of Service<\u002Fspan>\n        <span style=\"color:#B4B4C4;font-size:14px\">Privacy Policy<\u002Fspan>\n        <span style=\"color:#B4B4C4;font-size:14px\">Data Processing Agreement<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px 24px;padding-top:20px;font-size:12px;color:#B4B4C4\">\n      <span>© 2026 Nexyra Consulting<\u002Fspan>\n      <span>Payments by Stripe and GoCardless<\u002Fspan>\n      <span style=\"margin-left:auto\">Prices exclude VAT<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PLANS = [\n  { id: 'starter', name: 'Starter', limit: 10, monthly: 29, annual: 290, blurb: 'Single-site teams moving off spreadsheets and group chats.' },\n  { id: 'team', name: 'Team', limit: 50, monthly: 79, annual: 790, blurb: 'Growing teams across a few locations, with several managers.', popular: true },\n  { id: 'business', name: 'Business', limit: 200, monthly: 179, annual: 1790, blurb: 'Multi-site operators who need approvals, audit and payroll exports at scale.' },\n  { id: 'enterprise', name: 'Enterprise', limit: null, monthly: null, annual: null, blurb: 'More than 200 staff, custom terms, onboarding support and invoiced billing.' }\n];\nconst FEATURES = [\n  ['Weekly rota', 'Drag shifts to move them, Alt-drag to copy, repeat weekly, and copy last week in one click. Publish when it is ready.'],\n  ['Timesheets', 'Record actual start, finish and break against each shift. Late and early flags appear automatically.'],\n  ['Approvals and locking', 'Approve a week per employee. Approved weeks lock; later changes need a reason and are logged as amendments.'],\n  ['Overnight-safe hours', '18:00 to 02:00 is 8 hours, less the break. Paid hours use actuals where recorded, otherwise the schedule.'],\n  ['Working-time rules', 'Weekly maximum per contract, minimum rest, consecutive days. Breaches warn on the rota without blocking you.'],\n  ['Leave and availability', 'Holiday, sickness and regular unavailable days, shown on the rota so clashes are obvious.'],\n  ['Shift swaps', 'Staff request a swap on a future shift. Managers approve or decline from the rota.'],\n  ['Payroll and reports', 'Payroll CSV with basic and overtime hours, A4 PDF reports, and breakdowns by location, department and role.']\n];\nconst STEPS = [\n  ['01', 'Create your workspace', 'Sign up with your company name and email. Bring existing NEXTime data across if you have it.'],\n  ['02', 'Add locations and staff', 'Set up sites, departments, roles and contracts. Shift templates make the first rota quick.'],\n  ['03', 'Invite your team', 'Managers get the rota and timesheets. Employees see their own shifts and hours.'],\n  ['04', 'Publish and approve', 'Publish the week, record actual times, approve timesheets and export payroll.']\n];\nconst SECURITY = [\n  ['Two-factor sign-in', 'Authenticator-app codes on every account, and Owners can make it mandatory.'],\n  ['Four roles', 'Owner, Admin, Manager and Employee, each seeing only what they need.'],\n  ['Full audit history', 'Every shift, timesheet, approval and sign-in is recorded with who and when.'],\n  ['Isolated workspaces', 'Row-level security keeps each company’s data separate, encrypted in transit and at rest.'],\n  ['Export any time', 'Download the whole workspace as JSON, or payroll as CSV, whenever you want.']\n];\nconst INCLUDED = ['Unlimited locations', 'Unlimited managers', 'Weekly rota and templates', 'Timesheets and approvals', 'Working-time rules', 'Leave and availability', 'Shift swaps', 'Payroll CSV and PDF reports', 'Two-factor and roles', 'Audit history and data export'];\nconst FAQS = [\n  ['How does the free trial work?', 'You get 14 days with every feature. A card is optional: add one at sign-up or any time during the trial, and nothing is charged until it ends. If you add nothing, the workspace pauses and your data is kept.'],\n  ['How do I pay?', 'By debit or credit card (Visa, Mastercard, American Express), Apple Pay or Google Pay through Stripe; by Direct Debit through GoCardless (UK Bacs, SEPA, US ACH, Australian and New Zealand BECS, Canadian PAD); or, on yearly plans, by invoice and bank transfer. Change method any time in Workspace → Plan & billing.'],\n  ['What counts as active staff?', 'Anyone on your staff list who is not marked as Left. Owner, admin and manager logins are free, so you only pay for the people you schedule.'],\n  ['Can I change plan later?', 'Yes, at any time from Workspace → Plan & billing. Upgrades and downgrades are prorated on your next payment.'],\n  ['What happens if we grow past our plan?', 'NEXTime asks the Owner to move up a plan before more active staff can be added. Nothing already in the rota is affected.'],\n  ['Where is our data and who can see it?', 'Each company has its own isolated workspace protected by row-level security, encrypted in transit and at rest. Only people you invite can sign in, and every change is in the audit history.'],\n  ['Can we cancel?', 'Any time. Your data is kept for 90 days after cancelling in case you change your mind, and you can export everything first.'],\n  ['Do prices include VAT?', 'No. Prices are in GBP and exclude VAT, which is added where it applies.']\n];\n\nconst FAQ_GROUP = ['Trial and billing', 'Trial and billing', 'Plans', 'Plans', 'Plans', 'Data and security', 'Trial and billing', 'Trial and billing'];\nconst FAQ_ORDER = ['Trial and billing', 'Plans', 'Data and security'];\nconst slugify = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');\nconst WAYS = [['Debit and credit card', 'Visa, Mastercard and American Express, charged automatically each month or year.'], ['Apple Pay and Google Pay', 'One tap on your phone or browser.'], ['Direct Debit', 'UK Bacs, SEPA, ACH, BECS and PAD, with notice before each payment.'], ['Invoice and bank transfer', 'For yearly plans and Enterprise, payable within 30 days.']];\nfunction parseRoute(hash) {\n  const p = String(hash || '').replace(/^#\\/?/, '').split('/');\n  if (p[0] === 'pricing') return { route: 'pricing', target: p[1] === 'plans' ? 'pricing' : p[1] || '' };\n  if (p[0] === 'faq') return { route: 'faq', target: p[1] ? 'faq-' + p[1] : '' };\n  if (['features', 'how-it-works', 'security'].indexOf(p[0]) >= 0) return { route: 'home', target: p[0] };\n  return { route: 'home', target: '' };\n}\n\nclass Component extends DCLogic {\n  state = { route: 'home', cycle: 'monthly', ready: false };\n\n  componentDidMount() {\n    const go = (initial) => {\n      const r = parseRoute(location.hash);\n      if (r.route !== this.state.route) this.setState({ route: r.route });\n      setTimeout(() => {\n        document.body.style.overflow = '';\n        const el = r.target && document.getElementById(r.target);\n        if (el) {\n          if (el.tagName === 'DETAILS') el.open = true;\n          const clear = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nx-clear')) || 110;\n          window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - clear, behavior: initial ? 'auto' : 'smooth' });\n        } else if (!initial) window.scrollTo(0, 0);\n      }, 90);\n    };\n    go(true);\n    this._h = () => go(false);\n    window.addEventListener('hashchange', this._h);\n    const wait = () => { if (!window.NXSaaS) return setTimeout(wait, 40); this.setState({ ready: true }); };\n    wait();\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this._h); }\n\n  renderVals() {\n    const s = this.state, S = window.NXSaaS;\n    const acct = (qs) => (S ? S.url('account', qs) : '#');\n    const home = s.route === 'home';\n    const annual = s.cycle === 'annual';\n    return {\n      isHome: home, notHome: !home, isPricing: s.route === 'pricing', isFaq: s.route === 'faq',\n      showPlans: s.route !== 'faq', showFaqSection: s.route !== 'faq',\n      navActive: home ? 'product' : s.route,\n      navFeatures: FEATURES.map((f) => ({ title: f[0], text: f[1] })),\n      navFaqs: FAQS.map((f, i) => ({ q: f[0], a: f[1], slug: slugify(f[0]), group: FAQ_GROUP[i] || 'More' })),\n      faqGroups: FAQ_ORDER.map((g, gi) => ({ heading: g, id: 'topic-' + slugify(g), num: String(gi + 1).padStart(2, '0'), items: FAQS.map((f, i) => ({ q: f[0], a: f[1], id: 'faq-' + slugify(f[0]), g: FAQ_GROUP[i] })).filter((x) => x.g === g) })),\n      searchIndex: [].concat(\n        [{ meta: 'Page', title: 'Product overview', text: 'Rotas, timesheets, approvals and payroll-ready hours for teams with one site or many.', url: '#/' }, { meta: 'Page', title: 'Pricing', text: 'One price per team size. Every feature in every plan. 14-day free trial.', url: '#/pricing' }, { meta: 'Page', title: 'FAQ', text: 'Questions about the trial, plans, payment and your data.', url: '#/faq' }],\n        FEATURES.map((f) => ({ meta: 'Feature', title: f[0], text: f[1], url: '#/features' })),\n        STEPS.map((x) => ({ meta: 'How it works', title: x[1], text: x[2], url: '#/how-it-works' })),\n        SECURITY.map((x) => ({ meta: 'Security', title: x[0], text: x[1], url: '#/security' })),\n        PLANS.map((p) => ({ meta: 'Plan', title: p.name + (p.monthly ? ' · £' + p.monthly + '/month' : ''), text: (p.limit ? 'Up to ' + p.limit + ' active staff. ' : 'More than 200 active staff. ') + p.blurb, url: '#/pricing/plans' })),\n        WAYS.map((w) => ({ meta: 'Ways to pay', title: w[0], text: w[1], url: '#/pricing/ways-to-pay' })),\n        FAQS.map((f) => ({ meta: 'Question', title: f[0], text: f[1], url: '#/faq/' + slugify(f[0]) }))\n      ),\n      signInUrl: acct(), trialUrl: acct({ view: 'signup' }),\n      features: FEATURES.map((f, i) => ({ num: String(i + 1).padStart(2, '0'), title: f[0], text: f[1] })),\n      steps: STEPS.map((x) => ({ num: x[0], label: x[1], text: x[2] })),\n      security: SECURITY.map((x) => ({ title: x[0], text:
