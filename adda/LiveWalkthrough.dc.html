<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48.png">
<link rel="icon" type="image/png" sizes="512x512" href="images/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
<script>if(location.protocol==='file:')document.write('<script src="js/offline-bundle.js"><\/script>')</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Adda Live · Organiser walkthrough</title>
<link rel="stylesheet" href="css/modernist.css">
<link rel="stylesheet" href="css/theme.css">
<style>body{margin:0;background:var(--color-bg);overflow-x:hidden}</style>
</helmet>

<dc-import name="Live" preview="{{ stepId }}" on-preview-step="{{ goTo }}" hint-size="100%,100vh"></dc-import>
<div aria-hidden="true" style="height:{{ spacer }}"></div>

<aside aria-label="Walkthrough" style="position:fixed;left:50%;bottom:clamp(8px,2vw,20px);transform:translateX(-50%);z-index:3000;width:min(1120px,calc(100% - 16px));box-sizing:border-box;background:var(--adda-white);color:var(--color-text);border-top:4px solid var(--color-accent-2);box-shadow:0 18px 48px rgba(7,25,53,.30)">
  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
    <div style="padding:16px clamp(14px,2.4vw,24px) 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px 32px;align-items:start">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <span style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800)">Step {{ n }} of {{ total }}<span style="padding:2px 8px;background:{{ whoBg }};color:{{ whoInk }}">{{ step.who }}</span></span>
        <strong style="font-size:clamp(18px,2vw,22px);line-height:1.2;letter-spacing:-.01em">{{ step.title }}</strong>
        <p style="margin:0;font-size:15px;line-height:1.5">{{ step.body }}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <div style="display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--color-accent-100)">
          <span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-800)">Behind the scenes</span>
          <span style="font-size:14px;line-height:1.45;color:var(--color-accent-900)">{{ step.server }}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px">
          <ol aria-label="Steps" style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px">
            <sc-for list="{{ dots }}" as="d" hint-placeholder-count="10">
              <li><button type="button" onClick="{{ d.go }}" aria-label="{{ d.label }}" aria-current="{{ d.cur }}" style="width:28px;height:28px;padding:0;border:2px solid {{ d.border }};background:{{ d.bg }};color:{{ d.ink }};font:inherit;font-size:12px;font-weight:700;cursor:pointer">{{ d.num }}</button></li>
            </sc-for>
          </ol>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-ghost" onClick="{{ toggle }}" style="min-height:40px">Hide</button>
            <button type="button" class="btn btn-secondary" onClick="{{ prev }}" disabled="{{ atStart }}" style="min-height:40px">← Back</button>
            <button type="button" class="btn btn-primary" onClick="{{ next }}" disabled="{{ atEnd }}" style="min-height:40px">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 16px">
      <span style="font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Step {{ n }} of {{ total }} · {{ step.title }}</span>
      <div style="display:flex;gap:6px;flex:none">
        <button type="button" class="btn btn-secondary" onClick="{{ prev }}" disabled="{{ atStart }}" style="min-height:36px;padding:6px 10px" aria-label="Previous step">←</button>
        <button type="button" class="btn btn-primary" onClick="{{ next }}" disabled="{{ atEnd }}" style="min-height:36px;padding:6px 10px" aria-label="Next step">→</button>
        <button type="button" class="btn btn-ghost" onClick="{{ toggle }}" style="min-height:36px">Show</button>
      </div>
    </div>
  </sc-if>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script>
const STEPS = [
  { id: 'offline', who: 'Visitor', title: 'A visitor opens Adda Live', body: 'No stream is running, so there is no green dot in the menu. Visitors can browse previous streams, and they never see any streaming controls.', server: 'GET /api/live/status → { live: null }. Every page checks this every 15 seconds to decide whether to show the green dot.' },
  { id: 'admin-signin', who: 'Organiser', title: 'An organiser signs in', body: 'At the bottom of Adda Live, “Organiser sign-in” opens this form. It is separate from member sign-in. Press Sign in to continue.', server: 'POST /api/auth/login checks the password hash and sets a secure, HttpOnly session cookie that page scripts can’t read. Repeated failed attempts are blocked for 15 minutes.' },
  { id: 'admin-offline', who: 'Organiser', title: 'Signed in: “Start streaming” appears', body: 'Only signed-in organisers see Start streaming, here and in the top menu (on wide screens and in the mobile menu). Press it to begin.', server: 'GET /api/auth/me → { admin }. Hiding the button is only a convenience: the server rejects start/end requests that have no organiser session.' },
  { id: 'admin-title', who: 'Organiser', title: '“What is this stream for?”', body: 'The organiser types the title, for example Adda Durga Puja 2026. Viewers see it on the page, in the menu while live, and in the archive afterwards.', server: 'Nothing is sent yet. The title is checked (3–80 characters) here and again on the server.' },
  { id: 'admin-camera', who: 'Organiser', title: 'Camera check, still not live', body: 'The browser asks for camera and microphone access, finds the cameras and shows a preview. With more than one camera, a picker appears. Press Start streaming when ready.', server: 'Camera access stays in the browser. No video leaves the device until Start streaming is pressed.' },
  { id: 'admin-camera-error', who: 'Organiser', title: 'If the camera is blocked or missing', body: 'The organiser gets a clear reason and step-by-step fixes for each browser and device, then Try again. There is a separate message for no camera found and for a camera in use by another app.', server: 'Browser permission errors are turned into plain instructions. The organiser can’t press Start streaming until a camera works.' },
  { id: 'admin-live', who: 'Organiser', title: 'Live: the organiser’s controls', body: 'The organiser sees their own camera, the connection status, time live, camera and microphone, plus End streaming. Only the organiser who started the stream gets these controls.', server: 'POST /api/live/start creates a one-time stream key, sent only to this organiser → the browser sends video to Amazon IVS → POST /streams/:id/live marks it live.' },
  { id: 'live', who: 'Visitor', title: 'Meanwhile, what every visitor sees', body: 'A glowing green dot sits next to Adda Live in the menu on every page. Clicking it goes straight to the stream, with its title and the video player. There are no controls.', server: 'GET /api/live/status → { live: { title, playbackUrl } }. Viewers watch through Amazon IVS’s network, a few seconds behind real time, whatever the audience size.' },
  { id: 'admin-end-confirm', who: 'Organiser', title: 'Ending the stream', body: 'End streaming asks for confirmation, so a mis-tap doesn’t cut the pujo off mid-aarti.', server: 'POST /api/live/streams/:id/end accepts only the organiser who started the stream. A visitor calling this directly gets 401 (not signed in) or 403 (not the owner).' },
  { id: 'admin-ended', who: 'Organiser', title: 'Ended and archived', body: 'The green dot disappears for everyone. The stream keeps its title and date under Previous streams, shows “Recording processing”, and becomes playable once Amazon finishes saving it.', server: 'The server stops the stream on Amazon IVS and deletes the stream key. Amazon’s recording-finished notification attaches the saved video to the stream. If the organiser’s tab closes mid-stream, it is ended automatically after 90 seconds without video.' }
];

class Component extends DCLogic {
  state = { i: 0, open: true };
  componentDidMount() {
    this.onKey = (e) => {
      const t = e.target, typing = t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
      if (typing) return;
      if (e.key === 'ArrowRight') this.go(this.state.i + 1);
      else if (e.key === 'ArrowLeft') this.go(this.state.i - 1);
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  go(i) { const n = Math.max(0, Math.min(STEPS.length - 1, i)); if (n !== this.state.i) this.setState({ i: n }); }
  renderVals() {
    const { i, open } = this.state, step = STEPS[i], org = step.who === 'Organiser';
    return {
      stepId: step.id, step, n: i + 1, total: STEPS.length, open, closed: !open,
      spacer: open ? '240px' : '72px',
      whoBg: org ? 'var(--color-accent)' : 'var(--adda-leaf-100)', whoInk: org ? 'var(--adda-white)' : 'var(--adda-leaf-700)',
      atStart: i === 0, atEnd: i === STEPS.length - 1,
      prev: () => this.go(i - 1), next: () => this.go(i + 1), toggle: () => this.setState({ open: !open }),
      goTo: (id) => { const k = STEPS.findIndex((s) => s.id === id); if (k >= 0) this.go(k); },
      dots: STEPS.map((s, k) => ({ num: String(k + 1), label: 'Step ' + (k + 1) + ': ' + s.title, cur: k === i ? 'step' : 'false', go: () => this.go(k),
        bg: k === i ? 'var(--color-accent)' : 'transparent', ink: k === i ? 'var(--adda-white)' : 'var(--color-text)', border: k === i ? 'var(--color-accent)' : 'var(--color-divider)' }))
    };
  }
}
</script>
</body>
</html>
