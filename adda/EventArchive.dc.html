<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="css/modernist.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/site.js"></script>
<style>html{scroll-behavior:smooth;scroll-padding-top:120px}body{margin:0;background:var(--color-bg);overflow-x:hidden}</style>
</helmet>
<dc-import name="SiteHeader" current="events" hint-size="100%,97px" style="display:block"></dc-import>
<main id="main">
  <header data-hero="" style="position:relative;overflow:hidden;background:var(--color-accent-900);color:var(--adda-white);min-height:clamp(420px,62vh,660px);display:flex;align-items:flex-end"><img src="images/a-close-up-of-a-statue-of-a-woman.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block"></img><div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,25,53,.86) 0%,rgba(7,25,53,.58) 60%,rgba(7,25,53,.32) 100%),linear-gradient(180deg,rgba(7,25,53,.25),rgba(7,25,53,.55))"></div><div style="position:relative;width:100%;box-sizing:border-box;max-width:1200px;margin:0 auto;padding:clamp(32px,6vw,80px) clamp(20px,5vw,48px) clamp(32px,5vw,56px);display:flex;flex-direction:column;gap:18px;padding-top:clamp(64px,12vh,140px);text-shadow:0 1px 14px rgba(7,25,53,.45)">
    <nav aria-label="Breadcrumb" style="display:flex;flex-wrap:wrap;gap:8px;font-size:14px"><a href="Events.dc.html">Events</a><span aria-hidden="true">/</span><a href="Events.dc.html#past">Past events</a><span aria-hidden="true">/</span><span aria-current="page">{{ title }}</span></nav>
    <h1 style="font-size:clamp(42px,6.4vw,80px);line-height:1;letter-spacing:-.035em;margin:0">{{ title }}</h1>
    <p style="margin:0;font-size:clamp(18px,1.6vw,21px);line-height:1.6;max-width:34em">{{ intro }}</p>
    <nav aria-label="Sections" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
      <sc-for list="{{ subs }}" as="s" hint-placeholder-count="0"><a href="{{ s.hash }}" style="min-height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)" style-hover="background:rgba(255,255,255,.16)">{{ s.title }}<span style="font-weight:600;color:var(--adda-white)">{{ s.count }}</span></a></sc-for>
    </nav>
  </div><a href="https://unsplash.com/photos/a-close-up-of-a-statue-of-a-woman-bFFwCv_EtHs" target="_blank" rel="noopener" style="position:absolute;right:12px;bottom:10px;z-index:1;font-size:9px;color:rgba(255,255,255,.85);text-decoration:none">Photo: Souvik laha / Unsplash</a></header>
  <sc-for list="{{ subs }}" as="s" hint-placeholder-count="0">
    <section id="{{ s.id }}" aria-label="{{ s.title }}" style="border-top:1px solid color-mix(in srgb,var(--color-text) 12%,transparent)">
      <div style="max-width:1200px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,5vw,48px)">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px clamp(32px,5vw,72px);align-items:start;margin-bottom:clamp(28px,4vw,48px)">
          <div style="display:flex;flex-direction:column;gap:16px">
            <h2 style="font-size:clamp(30px,4vw,52px);line-height:1.04;letter-spacing:-.025em;margin:0">{{ s.title }}</h2>
            <sc-for list="{{ s.text }}" as="p" hint-placeholder-count="0"><p style="margin:0;font-size:17px;line-height:1.7">{{ p }}</p></sc-for>
          </div>
          <sc-if value="{{ s.showCover }}" hint-placeholder-val="{{ false }}"><div style="aspect-ratio:4/3;overflow:hidden;background:var(--color-surface)"><img src="{{ s.img }}" alt="{{ s.title }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block"></img></div></sc-if>
        </div>
        <sc-if value="{{ s.hasEvents }}" hint-placeholder-val="{{ false }}">
          <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(calc(50% - 10px),240px),1fr));gap:clamp(24px,3vw,36px) clamp(16px,2vw,24px)">
            <sc-for list="{{ s.events }}" as="e" hint-placeholder-count="0">
              <li>
                <a href="{{ e.href }}" style="display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--color-text)" style-hover="color:var(--color-accent)">
                  <div style="aspect-ratio:4/5;overflow:hidden;background:var(--color-surface);box-shadow:0 1px 2px rgba(23,35,74,.05),0 6px 20px rgba(23,35,74,.05);transition:box-shadow .3s,transform .3s" style-hover="box-shadow:0 2px 6px rgba(23,35,74,.07),0 18px 44px rgba(23,35,74,.13);transform:translateY(-3px)">
                    <sc-if value="{{ e.ok }}" hint-placeholder-val="{{ false }}"><img src="{{ e.img }}" alt="{{ e.title }}" loading="lazy" onError="{{ e.onErr }}" style="width:100%;height:100%;object-fit:cover;display:block"></img></sc-if>
                    <sc-if value="{{ e.bad }}" hint-placeholder-val="{{ false }}"><div style="height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:18px;background:var(--color-accent-2-100)"><span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-2-800)">{{ e.subTitle }}</span><span style="font-size:22px;font-weight:800;line-height:1.1;color:var(--color-accent-800)">{{ e.title }}</span></div></sc-if>
                  </div>
                  <span style="display:flex;justify-content:space-between;gap:10px;font-size:17px;font-weight:800;line-height:1.25">{{ e.title }}<span aria-hidden="true" style="color:var(--color-accent)">→</span></span>
                </a>
              </li>
            </sc-for>
          </ul>
        </sc-if>
      </div>
    </section>
  </sc-for>
  <nav aria-label="Other categories" style="background:var(--adda-white)">
    <div style="max-width:1200px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,5vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px 40px">
      <sc-for list="{{ others }}" as="o" hint-placeholder-count="0">
        <a href="{{ o.href }}" style="display:flex;flex-direction:column;gap:4px;padding:20px 0;border-top:2px solid var(--color-accent-2);text-decoration:none;color:var(--color-text)" style-hover="color:var(--color-accent)"><span style="font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-2-800)">Past events</span><span style="font-size:22px;font-weight:800">{{ o.title }} →</span></a>
      </sc-for>
    </div>
  </nav>
</main>
<dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;cat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;festivals&quot;,&quot;cultural&quot;,&quot;sports&quot;],&quot;default&quot;:&quot;festivals&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { bad: {} };
  componentDidMount() { this.onReady = () => this.forceUpdate(); window.addEventListener('adda-ready', this.onReady); }
  componentWillUnmount() { window.removeEventListener('adda-ready', this.onReady); }
  renderVals() {
    const A = window.ADDA; const ARCH = A ? A.ARCH : {};
    const key = ARCH[this.props.cat] ? this.props.cat : 'festivals';
    const c = ARCH[key] || { title: '', intro: '', subs: [] };
    const bad = this.state.bad;
    return {
      title: c.title, intro: c.intro,
      subs: c.subs.map(s => ({ ...s, hash: '#' + s.id, count: s.events.length ? String(s.events.length) : '', hasEvents: s.events.length > 0, showCover: !s.events.length || s.text.length > 0,
        events: s.events.map(e => ({ ...e, ok: !bad[e.img], bad: !!bad[e.img], onErr: () => this.setState(st => ({ bad: { ...st.bad, [e.img]: true } })) })) })),
      others: Object.values(ARCH).filter(x => x.key !== key).map(x => ({ href: x.href, title: x.title }))
    };
  }
}
</script>
</body>
</html>
